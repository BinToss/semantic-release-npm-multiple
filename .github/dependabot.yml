version: 2

updates:
  - package-ecosystem: npm
    directory: '/'
    target-branch: develop
    schedule:
      interval: daily
      time: '13:00'
    ignore:
      - dependency-name: husky
    pull-request-branch-name:
      separator: '-'
    open-pull-requests-limit: 10
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
